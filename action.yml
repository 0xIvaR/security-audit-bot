name: 'Security Audit Bot'
description: 'Zero-configuration static security analysis engine for GitHub PRs'
author: 'Soham Kundu'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  base:
    description: 'Base commit SHA or target branch (e.g. main)'
    required: true
  head:
    description: 'Head commit SHA containing changes to audit'
    required: true
  github-token:
    description: 'GitHub token for PR review comment upsert'
    required: false
    default: '${{ github.token }}'
  pr-number:
    description: 'GitHub Pull Request number'
    required: false
    default: '${{ github.event.pull_request.number }}'
  repo:
    description: 'Repository name in format owner/repo'
    required: false
    default: '${{ github.repository }}'
  dry-run:
    description: 'Run offline audit without calling GitHub API'
    required: false
    default: 'false'
  html-report:
    description: 'Destination file path to export standalone HTML audit report'
    required: false
    default: ''

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - '--base'
    - '${{ inputs.base }}'
    - '--head'
    - '${{ inputs.head }}'
    - '--repo'
    - '${{ inputs.repo }}'
    - '--pr-number'
    - '${{ inputs.pr-number }}'
  env:
    GITHUB_TOKEN: '${{ inputs.github-token }}'
