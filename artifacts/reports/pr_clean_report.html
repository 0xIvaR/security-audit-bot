<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Security Audit Report — org/fullstack-app</title>
  <style>
    :root {
      --bg-primary: #0D1117;
      --bg-secondary: #161B22;
      --border-color: #30363D;
      --text-primary: #E6EDF3;
      --text-muted: #8B949E;
      --critical: #DA3633;
      --high: #D97706;
      --medium: #CA8A04;
      --passed: #238636;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 24px 0;
    }
    .stat-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }
    .stat-card h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: var(--text-muted);
    }
    .stat-card .val {
      font-size: 28px;
      font-weight: 700;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-critical { background: rgba(218, 54, 51, 0.2); color: var(--critical); border: 1px solid var(--critical); }
    .badge-high     { background: rgba(217, 119, 6, 0.2);  color: var(--high);     border: 1px solid var(--high); }
    .badge-medium   { background: rgba(202, 138, 4, 0.2);  color: var(--medium);   border: 1px solid var(--medium); }
    .badge-passed   { background: rgba(35, 134, 54, 0.2);  color: var(--passed);   border: 1px solid var(--passed); }
    .finding-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .finding-header {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    .finding-loc {
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    pre {
      background-color: #1F242C;
      padding: 12px;
      overflow-x: auto;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .remediation-box {
      background: rgba(9, 105, 218, 0.1);
      border-left: 4px solid #0969DA;
      padding: 8px 12px;
      margin-top: 12px;
      border-radius: 0 4px 4px 0;
    }
    footer {
      margin-top: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h2>🛡️ GitHub PR Security Audit Bot</h2>
        <span>Repository: org/fullstack-app | Commit: <code>feat/sa</code></span>
      </div>
      <div>
        <span class="badge badge-passed">PASSED</span>
      </div>
    </header>

    <div class="stat-grid">
      <div class="stat-card">
        <h3>Total Findings</h3>
        <div class="val">0</div>
      </div>
      <div class="stat-card">
        <h3>Critical Issues</h3>
        <div class="val" style="color: var(--critical);">0</div>
      </div>
      <div class="stat-card">
        <h3>High Issues</h3>
        <div class="val" style="color: var(--high);">0</div>
      </div>
      <div class="stat-card">
        <h3>Scan Latency</h3>
        <div class="val">18 ms</div>
      </div>
    </div>

    <h3>Detected Findings</h3>
    <p>No vulnerabilities detected.</p>

    <footer>
      🤖 Generated by Automated GitHub PR Security Audit Bot v1.0.0 • Budget SLA &lt; 4,800 ms
    </footer>
  </div>
</body>
</html>
